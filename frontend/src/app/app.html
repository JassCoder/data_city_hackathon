<a class="skip-link" href="#map-region">Skip to map</a>

<header class="topbar">
  <span class="brand" translate="no">SkyRoute Warsaw</span>
  <app-demo-badge />
  <span class="spacer"></span>
  <span class="backend" [class]="'backend backend-' + backendStatus()" data-testid="backend-status"
        [attr.title]="backendTitle()" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span class="backend-label">{{ backendLabel() }}</span>
  </span>
  @if (backendStatus() === 'offline' || layers.resource.error()) {
    <button type="button" class="icon-btn" (click)="retry()" aria-label="Retry backend connection" title="Retry">
      <app-icon name="refresh" />
    </button>
  }
</header>

<div class="shell" [class.drawer-open]="drawerOpen()">
  <aside class="sidebar" [attr.data-sheet]="sheet()" aria-label="Drones">
    <button type="button" class="sheet-handle" (click)="cycleSheet()" [attr.aria-label]="sheetLabel()"
            data-testid="sheet-handle">
      <span class="grip" aria-hidden="true"></span>
    </button>
    <div class="sidebar-body">
      <app-planner-panel />
    </div>
  </aside>

  <main class="map-col" id="map-region" tabindex="-1" aria-label="Map">
    <app-map
      [layers]="layers.data()"
      [start]="planner.start()"
      [destination]="planner.destination()"
      [route]="planner.route()"
      [picking]="planner.pickTarget() !== null"
      [zones]="airspace.visibleZones()"
      [airspaceSource]="airspace.source()"
      [highlightZoneIds]="airspace.highlightZoneIds()"
      [focusZoneId]="airspace.focusZoneId()"
      [boundary]="mapData.boundaryData()"
      [boundaryMissing]="mapData.boundaryMissing()"
      (mapClick)="planner.handleMapClick($event)"
      (focusDone)="airspace.focusZoneId.set(null)"
    />
  </main>

  <aside class="drawer" aria-label="Route details" [attr.aria-hidden]="!drawerOpen()" [attr.inert]="drawerOpen() ? null : ''"
         data-testid="drawer">
    <div class="drawer-head">
      <h2>Route details</h2>
      <button type="button" class="icon-btn" (click)="closeDrawer()" aria-label="Close route details">
        <app-icon name="close" />
      </button>
    </div>
    <div class="drawer-body">
      <app-route-results />
      <app-airspace-panel />
    </div>
  </aside>
</div>
