<mat-toolbar class="topbar">
  <span class="brand">SkyRoute Warsaw</span>
  <span class="spacer"></span>
  <button mat-stroked-button class="fleet-toggle" data-testid="fleet-toggle" [attr.aria-pressed]="fleet.dashboardOpen()"
          (click)="fleet.dashboardOpen.set(!fleet.dashboardOpen())">
    <mat-icon>local_shipping</mat-icon> <span class="label">Fleet dashboard</span>
  </button>
  @if (backendStatus() === 'offline' || layers.resource.error()) {
    <button mat-icon-button (click)="retry()" aria-label="Retry backend connection">
      <mat-icon>refresh</mat-icon>
    </button>
  }
</mat-toolbar>
@if (layers.resource.isLoading()) {
  <mat-progress-bar mode="indeterminate" class="loading-bar" />
}

<div class="layout" [class.with-fleet]="fleet.dashboardOpen()">
  <aside class="panel left">
    <app-planner-panel />
  </aside>

  <main class="map-area">
    <app-map
      [layers]="layers.data()"
      [start]="planner.start()"
      [destination]="planner.destination()"
      [route]="planner.route()"
      [simulation]="sim.frame() ?? flight.frame()"
      [zoomDistrict]="fleet.district()"
      [picking]="planner.pickTarget() !== null || fleet.pickTarget() !== null"
      [zones]="airspace.visibleZones()"
      [airspaceSource]="airspace.source()"
      [highlightZoneIds]="airspace.highlightZoneIds()"
      [focusZoneId]="airspace.focusZoneId()"
      [boundary]="mapData.boundaryData()"
      [boundaryMissing]="mapData.boundaryMissing()"
      [hospitals]="fleet.hospitals()"
      [depots]="fleet.depots()"
      [pads]="fleet.pads()"
      [partners]="fleet.partners()"
      [allRestaurants]="fleet.allRestaurants()"
      [drones]="fleet.drones()"
      [deliveries]="fleet.activeOrders()"
      [entrances]="planner.entranceChoice()?.entrances ?? []"
      (entranceSelected)="planner.chooseEntrance($event)"
      (facilityAction)="onFacilityAction($event)"
      (mapClick)="onMapClick($event)"
      (focusDone)="airspace.focusZoneId.set(null)"
    />
    <div class="overlay top-right">
      <app-map-layers-control />
      <app-route-details-panel />
    </div>
    @if (sim.message(); as m) {
      <div class="overlay sim-toast" role="status" data-testid="sim-toast">{{ m }}</div>
    }
    <div class="overlay bottom-right">
      <app-airspace-legend />
    </div>
  </main>

  @if (fleet.dashboardOpen()) {
    <aside class="panel fleet" data-testid="fleet-panel">
      <app-fleet-panel />
    </aside>
  }

</div>
