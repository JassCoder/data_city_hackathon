<a class="skip-link" href="#map-region">Skip to map</a>

<header class="topbar">
  <h1 class="brand" translate="no">SkyRoute Warsaw</h1>
  <app-demo-badge />
  <nav class="view-switch" aria-label="View">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"
       data-testid="nav-plan">Plan</a>
    <a routerLink="/simulate" routerLinkActive="active" ariaCurrentWhenActive="page" data-testid="nav-simulate">Simulate</a>
  </nav>
  <span class="spacer"></span>
  <span class="backend" [class]="'backend backend-' + health.status()" data-testid="backend-status"
        [attr.title]="backendTitle()" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span class="backend-label">{{ backendLabel() }}</span>
  </span>
  @if (health.status() === 'offline' || layers.resource.error()) {
    <button type="button" class="icon-btn" (click)="retry()" aria-label="Retry backend connection" title="Retry">
      <app-icon name="refresh" />
    </button>
  }
</header>

<router-outlet />
